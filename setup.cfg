[metadata]
name = seqLister
version = attr: seqLister.__version__
author = James Rowell
author_email = james@alpha-eleven.com
description = Python library to expand and condense integer-sequences using a simple syntax widely used within the VFX-industry for specifying frame-ranges.
license = BSD-3-Clause
license_files = LICENSE
keywords = vfx, visual-effects, frame-range, image-sequence, file-sequence, cg-production, animation, pipeline
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/jrowellfx/seqLister
project_urls =
    Bug Tracker = https://github.com/jrowellfx/seqLister/issues
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Topic :: Multimedia :: Graphics
    Topic :: Software Development :: Libraries :: Python Modules
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6

[options.packages.find]
where = src

